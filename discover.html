<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keşfet | Bio</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', system-ui, sans-serif; background: #0a0a0a; color: #fff;
            min-height: 100vh; padding: 0 0 60px;
        }
        header {
            position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
            padding: 18px 24px; background: rgba(10,10,10,0.85); backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        header .logo { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
        header .logo span { color: #ff4444; }
        header nav a {
            color: #ccc; text-decoration: none; font-size: 13px; padding: 8px 16px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.12); margin-left: 8px; transition: all .2s;
        }
        header nav a:hover { background: rgba(255,255,255,0.08); }
        header nav a.primary { background: linear-gradient(135deg, #ff3b3b, #cc0000); border-color: transparent; color: #fff; }

        .hero { padding: 54px 24px 34px; text-align: center; max-width: 640px; margin: 0 auto; }
        .hero h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 10px; }
        .hero p { color: #999; font-size: 14px; }

        .grid {
            max-width: 1100px; margin: 0 auto; padding: 10px 20px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px;
        }
        .card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px;
            padding: 22px 18px; text-align: center; text-decoration: none; color: inherit;
            transition: transform .25s ease, border-color .25s ease, background .25s ease;
        }
        .card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); }
        .card img { width: 68px; height: 68px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.15); background: #141414; margin-bottom: 12px; }
        .card .name { font-size: 15px; font-weight: 600; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card .handle { font-size: 12px; color: #ff6b6b; margin-bottom: 8px; }
        .card .bio { font-size: 12px; color: #888; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 32px; }
        .card .views { margin-top: 12px; font-size: 11px; color: #666; }

        .empty, .loading { text-align: center; color: #777; padding: 60px 20px; font-size: 14px; }
        .spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.15); border-top-color: #fff; border-radius: 50%; animation: sp 0.8s linear infinite; margin: 0 auto 14px; }
        @keyframes sp { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .hero h1 { font-size: 26px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
            .card { padding: 16px 12px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">bio<span>.</span></div>
        <nav>
            <a href="/login.html">Giriş</a>
            <a class="primary" href="/register.html">Kayıt Ol</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Yeni Katılanları Keşfet</h1>
        <p>Az önce oluşturulan bio sayfalarına göz at.</p>
    </div>

    <div class="loading" id="loadingState"><div class="spinner"></div>Yükleniyor...</div>
    <div class="grid" id="grid"></div>
    <div class="empty hidden" id="emptyState">Henüz kimse bio oluşturmamış — ilk sen ol!</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNnqSKYVW_JMc4CO5KoNQb4ctrMdIMS6s",
            authDomain: "rolex-bio.firebaseapp.com",
            projectId: "rolex-bio",
            storageBucket: "rolex-bio.firebasestorage.app",
            messagingSenderId: "182739949955",
            appId: "1:182739949955:web:bd859e25ceee8936273eb6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function safeUrl(url) {
            if (!url) return '';
            try {
                const u = new URL(String(url), window.location.href);
                if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
            } catch (e) {}
            return '';
        }

        db.collection('users').orderBy('createdAt', 'desc').limit(24).get().then(snap => {
            document.getElementById('loadingState').classList.add('hidden');
            if (snap.empty) { document.getElementById('emptyState').classList.remove('hidden'); return; }
            const grid = document.getElementById('grid');
            snap.forEach(doc => {
                const d = doc.data();
                if (!d.username) return;
                const a = document.createElement('a');
                a.className = 'card';
                a.href = '/' + encodeURIComponent(d.username);

                const img = document.createElement('img');
                img.src = safeUrl(d.avatar) || 'https://i.imgur.com/6VBx3io.png';
                img.alt = d.name || d.username;
                img.loading = 'lazy';

                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = d.name || d.username;

                const handle = document.createElement('div');
                handle.className = 'handle';
                handle.textContent = '@' + d.username;

                const bio = document.createElement('div');
                bio.className = 'bio';
                bio.textContent = d.bio || '';

                const views = document.createElement('div');
                views.className = 'views';
                views.textContent = '👁 ' + (d.views || 0);

                a.append(img, name, handle, bio, views);
                grid.appendChild(a);
            });
        }).catch(() => {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('emptyState').classList.remove('hidden');
            document.getElementById('emptyState').textContent = 'Şu an yüklenemedi, daha sonra tekrar dene.';
        });
    </script>
</body>
</html>
