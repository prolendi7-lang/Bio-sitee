<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keşfet | Bio</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0B0F17;
            color: #F9FAFB;
            min-height: 100vh;
            padding-bottom: 60px;
            background-image: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.06) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 40%);
        }
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(11, 15, 23, 0.85);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        header .logo {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header nav a {
            color: #9CA3AF;
            text-decoration: none;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-left: 8px;
            transition: all 0.2s ease;
        }
        header nav a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }
        header nav a.primary {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            border-color: transparent;
            color: #fff;
        }
        header nav a.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }
        .hero {
            text-align: center;
            padding: 48px 24px 28px;
            max-width: 600px;
            margin: 0 auto;
        }
        .hero h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .hero h1 span {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero p {
            color: #6B7280;
            font-size: 15px;
        }
        .grid {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 20px 16px 18px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.3);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
        .card img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.12);
            background: #141824;
            margin-bottom: 10px;
        }
        .card .name {
            font-size: 14px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card .handle {
            font-size: 12px;
            color: #3B82F6;
            margin-bottom: 4px;
        }
        .card .bio {
            font-size: 12px;
            color: #6B7280;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 32px;
        }
        .card .views {
            margin-top: 10px;
            font-size: 11px;
            color: #4B5563;
        }
        .loading,
        .empty {
            text-align: center;
            color: #6B7280;
            padding: 60px 20px;
            font-size: 14px;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3B82F6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 14px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 480px) {
            .hero h1 {
                font-size: 26px;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }
            .card {
                padding: 16px 12px;
            }
            header {
                padding: 12px 16px;
            }
            header nav a {
                padding: 6px 12px;
                font-size: 12px;
                margin-left: 4px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">bio<span style="color:#8B5CF6; -webkit-text-fill-color:#8B5CF6;">.</span></div>
        <nav>
            <a href="/login.html">Giriş</a>
            <a class="primary" href="/login.html">Kayıt Ol</a>
        </nav>
    </header>

    <div class="hero">
        <h1>🔎 <span>Keşfet</span></h1>
        <p>Yeni katılanların bio sayfalarına göz at.</p>
    </div>

    <div id="loadingState" class="loading">
        <div class="spinner"></div>
        Yükleniyor...
    </div>
    <div id="grid" class="grid"></div>
    <div id="emptyState" class="empty hidden">Henüz kimse bio oluşturmamış — ilk sen ol!</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNnqSKYVW_JMc4CO5KoNQb4ctrMdIMS6s",
            authDomain: "rolex-bio.firebaseapp.com",
            projectId: "rolex-bio",
            storageBucket: "rolex-bio.firebasestorage.app",
            messagingSenderId: "182739949955",
            appId: "1:182739949955:web:bd859e25ceee8936273eb6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function safeUrl(url) {
            if (!url) return '';
            try {
                const u = new URL(String(url), window.location.href);
                if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
            } catch (e) {}
            return '';
        }

        db.collection('users').orderBy('createdAt', 'desc').limit(30).get()
            .then(snap => {
                document.getElementById('loadingState').classList.add('hidden');
                const grid = document.getElementById('grid');
                if (snap.empty) {
                    document.getElementById('emptyState').classList.remove('hidden');
                    return;
                }
                snap.forEach(doc => {
                    const d = doc.data();
                    if (!d.username) return;
                    const a = document.createElement('a');
                    a.className = 'card';
                    a.href = '/' + encodeURIComponent(d.username);

                    const img = document.createElement('img');
                    img.src = safeUrl(d.avatar) || 'https://i.imgur.com/6VBx3io.png';
                    img.alt = d.name || d.username;
                    img.loading = 'lazy';

                    const name = document.createElement('div');
                    name.className = 'name';
                    name.textContent = d.name || d.username;

                    const handle = document.createElement('div');
                    handle.className = 'handle';
                    handle.textContent = '@' + d.username;

                    const bio = document.createElement('div');
                    bio.className = 'bio';
                    bio.textContent = d.bio || '';

                    const views = document.createElement('div');
                    views.className = 'views';
                    views.textContent = '👁 ' + (d.views || 0);

                    a.append(img, name, handle, bio, views);
                    grid.appendChild(a);
                });
            })
            .catch((err) => {
                console.error('Keşfet yüklenemedi:', err);
                document.getElementById('loadingState').classList.add('hidden');
                const empty = document.getElementById('emptyState');
                empty.classList.remove('hidden');
                empty.textContent = 'Şu an yüklenemedi, daha sonra tekrar dene.';
            });
    </script>
</body>
</html>
