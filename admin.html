<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Panelim</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        /* ===== TAMAMEN YENİ VE PROFESYONEL STİLLER ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0B0F17;
            color: #F9FAFB;
            min-height: 100vh;
            padding: 20px;
        }
        .app {
            max-width: 1400px;
            margin: 0 auto;
        }
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header .logo {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .header .user-info .email {
            color: #9CA3AF;
            font-size: 13px;
        }
        .header .user-info .url-chip {
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .header .user-info .url-chip:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn {
            padding: 8px 20px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #F9FAFB;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #F87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        /* Gate (Giriş kontrolü) */
        .gate {
            text-align: center;
            padding: 60px 20px;
            color: #9CA3AF;
        }
        .gate.hidden {
            display: none;
        }
        /* Verify Banner */
        .verify-banner {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .verify-banner.hidden {
            display: none;
        }
        .verify-banner .msg {
            color: #FBBF24;
            font-size: 13px;
        }
        .verify-banner .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
        }
        .panel h2 {
            font-size: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel h2 .badge {
            font-size: 12px;
            font-weight: 400;
            color: #6B7280;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #9CA3AF;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #F9FAFB;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        .range-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6B7280;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #3B82F6;
            background: transparent;
            padding: 0;
            border: none;
        }
        input[type="color"] {
            width: 48px;
            height: 48px;
            padding: 2px;
            border-radius: 10px;
            cursor: pointer;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .upload-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .upload-group input[type="file"] {
            display: none;
        }
        .upload-group .file-label {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            transition: all 0.2s;
        }
        .upload-group .file-label:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .upload-status {
            font-size: 12px;
        }
        .upload-status.loading {
            color: #FBBF24;
        }
        .upload-status.done {
            color: #34D399;
        }
        .upload-status.error {
            color: #F87171;
        }
        /* Link Listesi */
        .link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            margin-bottom: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .link-item .drag-handle {
            cursor: grab;
            color: #4B5563;
            font-size: 18px;
            user-select: none;
            width: 24px;
            text-align: center;
        }
        .link-item input {
            background: transparent;
            border: none;
            color: #F9FAFB;
            padding: 4px 6px;
            font-size: 13px;
            font-family: inherit;
            flex: 1;
            min-width: 50px;
        }
        .link-item input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
        }
        .link-item input[type="text"]:first-of-type {
            max-width: 40px;
            text-align: center;
        }
        .link-item .link-stats {
            font-size: 11px;
            color: #4B5563;
            white-space: nowrap;
        }
        .link-item .del-link {
            background: none;
            border: none;
            color: #6B7280;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .link-item .del-link:hover {
            color: #F87171;
        }
        .template-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0 12px;
        }
        .template-grid .tpl-btn {
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #9CA3AF;
            cursor: pointer;
            transition: all 0.2s;
        }
        .template-grid .tpl-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        /* Effect Buttons */
        .effect-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .effect-grid .effect-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #9CA3AF;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .effect-grid .effect-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .effect-grid .effect-btn.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3B82F6;
            color: #fff;
        }
        /* Theme Presets */
        .preset-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .preset-grid .preset-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #9CA3AF;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .preset-grid .preset-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        /* Preview Frame */
        .preview-container {
            position: sticky;
            top: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .preview-container iframe {
            width: 100%;
            height: 700px;
            border: none;
            background: #0B0F17;
        }
        @media (max-width: 900px) {
            .preview-container {
                position: static;
            }
            .preview-container iframe {
                height: 500px;
            }
        }
        .tab-toggle {
            display: none;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab-toggle button {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: transparent;
            color: #9CA3AF;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.2s;
        }
        .tab-toggle button.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: #3B82F6;
            color: #fff;
        }
        .tab-hidden {
            display: none !important;
        }
        @media (max-width: 900px) {
            .tab-toggle {
                display: flex;
            }
        }
        /* Message */
        .message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            display: none;
            max-width: 90%;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }
        .message.success {
            background: rgba(16, 185, 129, 0.2);
            color: #34D399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .message.error {
            background: rgba(239, 68, 68, 0.2);
            color: #F87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .section-divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin: 20px 0;
        }
        .hint {
            font-size: 12px;
            margin-top: 4px;
            min-height: 18px;
        }
        .hint.ok {
            color: #34D399;
        }
        .hint.bad {
            color: #F87171;
        }
        .hint.checking {
            color: #6B7280;
        }
        .inline-flex {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- GATE -->
        <div class="gate" id="gate">Yükleniyor...</div>

        <!-- ANA PANEL -->
        <div id="mainPanel" style="display:none;">

            <!-- HEADER -->
            <header class="header">
                <span class="logo">bio<span style="color:#8B5CF6; -webkit-text-fill-color:#8B5CF6;">.</span></span>
                <div class="user-info">
                    <span class="email" id="accountEmail">email@ornek.com</span>
                    <span class="url-chip" id="urlChip" title="Linki kopyala">site.com/kullanici</span>
                    <button class="btn btn-secondary btn-sm" id="logoutBtn">Çıkış</button>
                </div>
            </header>

            <!-- VERIFY BANNER -->
            <div class="verify-banner hidden" id="verifyBanner">
                <span class="msg">📧 E-postanı doğrulamadın. Hesabını korumak için lütfen doğrula.</span>
                <div class="actions">
                    <button class="btn btn-secondary btn-sm" id="resendVerifyBtn">Tekrar Gönder</button>
                    <button class="btn btn-secondary btn-sm" id="checkVerifyBtn">Kontrol Et</button>
                </div>
            </div>

            <!-- MOBILE TABS -->
            <div class="tab-toggle" id="tabToggle">
                <button class="active" id="tabEdit">✏️ Düzenle</button>
                <button id="tabPreview">👁️ Önizle</button>
            </div>

            <!-- MAIN LAYOUT -->
            <div class="main-layout">
                <!-- EDIT PANE -->
                <div class="panel" id="editPane">
                    <h2>✏️ Profil Düzenle</h2>

                    <!-- TEMEL BİLGİLER -->
                    <div class="form-group">
                        <label>İsim / Başlık</label>
                        <input type="text" id="nameInput" placeholder="Adın veya markan">
                    </div>
                    <div class="form-group">
                        <label>Bio</label>
                        <textarea id="bioInput" placeholder="Kendini tanıt..." rows="3"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Sol Emoji</label>
                            <input type="text" id="emojiLeft" placeholder="🔥" maxlength="4">
                        </div>
                        <div class="form-group">
                            <label>Sağ Emoji</label>
                            <input type="text" id="emojiRight" placeholder="✨" maxlength="4">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="emoji3d" checked> 3D Efektli Emoji
                        </label>
                    </div>

                    <hr class="section-divider">

                    <!-- PROFİL FOTOĞRAFI & ARKA PLAN -->
                    <div class="form-group">
                        <label>Profil Fotoğrafı</label>
                        <div class="upload-group">
                            <input type="text" id="avatarInput" placeholder="Fotoğraf URL" style="flex:1;">
                            <label class="file-label" id="avatarLabel">📁 Dosya Seç</label>
                            <input type="file" id="avatarUpload" accept="image/*">
                            <span class="upload-status" id="avatarStatus"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Arka Plan Resmi</label>
                        <div class="upload-group">
                            <input type="text" id="bgImage" placeholder="Arka plan URL" style="flex:1;">
                            <label class="file-label" id="bgLabel">📁 Dosya Seç</label>
                            <input type="file" id="bgUpload" accept="image/*">
                            <span class="upload-status" id="bgStatus"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Arka Plan Rengi</label>
                        <input type="color" id="bgColor" value="#0B0F17">
                    </div>
                    <div class="form-group">
                        <label>Arka Plan Videosu (URL)</label>
                        <input type="text" id="bgVideo" placeholder="video.mp4 veya .webm URL">
                    </div>

                    <hr class="section-divider">

                    <!-- EFFECTS & THEMES -->
                    <div class="form-group">
                        <label>Hazır Efektler</label>
                        <div class="effect-grid" id="effectGrid">
                            <button class="effect-btn active" data-effect="default">Varsayılan</button>
                            <button class="effect-btn" data-effect="gold">Altın</button>
                            <button class="effect-btn" data-effect="neon-red">Neon Kırmızı</button>
                            <button class="effect-btn" data-effect="neon-blue">Neon Mavi</button>
                            <button class="effect-btn" data-effect="purple">Mor</button>
                            <button class="effect-btn" data-effect="rainbow">Gökkuşağı</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Hazır Temalar</label>
                        <div class="preset-grid">
                            <button class="preset-btn" data-theme="cyberpunk">🤖 Cyberpunk</button>
                            <button class="preset-btn" data-theme="minimal">🌿 Minimal</button>
                            <button class="preset-btn" data-theme="gold">✨ Altın</button>
                            <button class="preset-btn" data-theme="neon">💚 Neon</button>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Yazı Tipi</label>
                            <select id="fontFamily">
                                <option value="Inter">Inter</option>
                                <option value="Poppins">Poppins</option>
                                <option value="Montserrat">Montserrat</option>
                                <option value="Playfair Display">Playfair Display</option>
                                <option value="Space Grotesk">Space Grotesk</option>
                                <option value="DM Sans">DM Sans</option>
                                <option value="Bebas Neue">Bebas Neue</option>
                                <option value="Caveat">Caveat</option>
                                <option value="Roboto Mono">Roboto Mono</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Neon Rengi</label>
                            <input type="color" id="neonColor" value="#3B82F6">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Neon Boyutu: <span id="ns">10px</span></label>
                        <input type="range" id="neonSize" min="2" max="30" value="10">
                    </div>
                    <div class="form-group">
                        <label>İsim Gradyanı</label>
                        <input type="text" id="nameGradient" placeholder="linear-gradient(...)">
                    </div>
                    <div class="form-group">
                        <label>İsim Gölgesi (Glow)</label>
                        <input type="text" id="nameGlow" placeholder="0 0 20px rgba(...)">
                    </div>

                    <hr class="section-divider">

                    <!-- KART AYARLARI -->
                    <div class="form-group">
                        <label>Kart Opaklığı: <span id="cov">80%</span></label>
                        <input type="range" id="cardOpacity" min="10" max="100" value="80">
                    </div>
                    <div class="form-group">
                        <label>Kart Bulanıklığı: <span id="cbv">20px</span></label>
                        <input type="range" id="cardBlur" min="0" max="40" value="20">
                    </div>

                    <hr class="section-divider">

                    <!-- BADGE -->
                    <div class="form-group">
                        <label><input type="checkbox" id="showBadge" checked> Rozeti Göster</label>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Rozet İkonu</label>
                            <input type="text" id="badgeIcon" value="✓" maxlength="3">
                        </div>
                        <div class="form-group">
                            <label>Rozet Rengi (CSS rengi veya gradient)</label>
                            <input type="text" id="badgeColor" value="linear-gradient(135deg, #3B82F6, #8B5CF6)">
                        </div>
                    </div>

                    <hr class="section-divider">

                    <!-- PARTİKÜLLER -->
                    <div class="form-group">
                        <label><input type="checkbox" id="particlesToggle" checked> Partikülleri Göster</label>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Partikül Rengi</label>
                            <input type="text" id="particleColor" value="rgba(59,130,246,0.3)">
                        </div>
                        <div class="form-group">
                            <label>Partikül Sayısı: <span id="pv">40</span></label>
                            <input type="range" id="particleCount" min="10" max="100" value="40">
                        </div>
                    </div>

                    <hr class="section-divider">

                    <!-- LİNKLER -->
                    <h2 style="font-size:16px; margin-top:0;">🔗 Linkler</h2>
                    <div class="template-grid">
                        <button class="tpl-btn" data-tpl="instagram">📷 Instagram</button>
                        <button class="tpl-btn" data-tpl="youtube">▶️ YouTube</button>
                        <button class="tpl-btn" data-tpl="tiktok">🎵 TikTok</button>
                        <button class="tpl-btn" data-tpl="discord">🎮 Discord</button>
                        <button class="tpl-btn" data-tpl="telegram">📱 Telegram</button>
                        <button class="tpl-btn" data-tpl="twitch">📺 Twitch</button>
                        <button class="tpl-btn" data-tpl="github">💻 GitHub</button>
                        <button class="tpl-btn" data-tpl="x">🐦 X</button>
                        <button class="tpl-btn" data-tpl="spotify">🎧 Spotify</button>
                        <button class="tpl-btn" data-tpl="website">🌐 Website</button>
                    </div>
                    <div id="linksList"></div>
                    <button class="btn btn-secondary btn-sm" id="addLinkBtn" style="margin-top:8px;">+ Link Ekle</button>

                    <hr class="section-divider">

                    <!-- BUTON AYARLARI -->
                    <div class="form-row">
                        <div class="form-group">
                            <label>Buton Stili</label>
                            <select id="btnStyle">
                                <option value="rounded-full">Yuvarlak</option>
                                <option value="rounded-lg">Köşeli</option>
                                <option value="rounded-none">Düz</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">

            const banner = $('verifyBanner');

        let resendCooldown = false;
        $('resendVerifyBtn').addEventListener('click', async () => {

                await auth.currentUser.sendEmailVerification();
                showMsg('Doğrulama e-postası tekrar gönderildi.', 'success');
                resendCooldown = true;
                btn.disabled = true;
                setTimeout(() => { resendCooldown = false;
                    btn.disabled = false; }, 60000);
            } catch (err) {
                showMsg('Gönderilemedi (' + (err.code || err.message) + ')', 'error');
            }
        });

            await auth.currentUser.reload();

        }

        function safeUrl(url) {
            if (!url) return '';
            try {
                const u = new URL(String(url), window.location.href);
                if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
            } catch (e) { return ''; }
            return '';

            const code = err?.code;

            return 'Hata: ' + (code || err?.message || 'bilinmeyen');

        // ============================================================
        // PREVIEW (postMessage)
        // ============================================================
        let pushTimer = null;

        function pushPreview() {
            clearTimeout(pushTimer);
            pushTimer = setTimeout(() => {
                const payload = collectFormData();
                if (previewReady) {
                    previewFrame.contentWindow.postMessage({ type: 'profile-preview', payload }, '*');
                } else {
                    pendingPreview = payload;
                }
            }, 80);
        }

        window.addEventListener('message', (ev) => {
            if (ev.data && ev.data.type === 'preview-ready') {
                previewReady = true;
                if (pendingPreview) {
                    previewFrame.contentWindow.postMessage({ type: 'profile-preview', payload: pendingPreview }, '*');
                    pendingPreview = null;
                }
            }
        });

        $('editPane').addEventListener('input', pushPreview);
        $('editPane').addEventListener('change', pushPreview);

        // ============================================================
        // RENDER LINKS (Sortable)
        // ============================================================
        function renderLinks() {
            const container = $('linksList');
            container.innerHTML = '';
            currentLinks.forEach((l, i) => {
                const row = document.createElement('div');
                row.className = 'link-item';
                row.dataset.index = i;

                const handle = document.createElement('span');
                handle.className = 'drag-handle';
                handle.textContent = '⋮⋮';

                const iconInput = document.createElement('input');
                iconInput.type = 'text';
                iconInput.placeholder = '🔗';
                iconInput.style.width = '44px';
                iconInput.value = l.icon || '🔗';
                iconInput.oninput = () => { currentLinks[i].icon = iconInput.value;
                    pushPreview(); };

                const titleInput = document.createElement('input');
                titleInput.type = 'text';
                titleInput.placeholder = 'Başlık';
                titleInput.value = l.title || '';
                titleInput.oninput = () => { currentLinks[i].title = titleInput.value;
                    pushPreview(); };

                const urlInput = document.createElement('input');
                urlInput.type = 'text';
                urlInput.placeholder = 'URL';
                urlInput.value = l.url || '';
                urlInput.oninput = () => { currentLinks[i].url = urlInput.value;
                    pushPreview(); };

                const stats = document.createElement('span');
                stats.className = 'link-stats';
                stats.textContent = '🖱️ ' + (l.clicks || 0);

                const delBtn = document.createElement('button');
                delBtn.className = 'del-link';
                delBtn.textContent = '✕';
                delBtn.onclick = () => { currentLinks.splice(i, 1);
                    renderLinks();
                    pushPreview(); };

                row.append(handle, iconInput, titleInput, urlInput, stats, delBtn);
                container.appendChild(row);
            });

            if (window._sortable) window._sortable.destroy();
            window._sortable = new Sortable(container, {
                handle: '.drag-handle',
                animation: 150,
                onEnd: (ev) => {
                    const items = Array.from(container.children);
                    const newOrder = items.map(el => parseInt(el.dataset.index));
                    const reordered = newOrder.map(i => currentLinks[i]);
                    currentLinks = reordered;
                    renderLinks();
                    pushPreview();
                }
            });
        }

        // ============================================================
        // ADD LINK
        // ============================================================
        $('addLinkBtn').addEventListener('click', () => {
            currentLinks.push({ icon: '🔗', title: 'Yeni Link', url: 'https://', clicks: 0 });
            renderLinks();
            pushPreview();
        });

        // ============================================================
        // TEMPLATE BUTTONS
        // ============================================================
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('tpl-btn')) {
                const tpl = TEMPLATES[e.target.dataset.tpl];
                if (tpl) {
                    currentLinks.push({ icon: tpl.icon, title: tpl.title, url: tpl.url, clicks: 0 });
                    renderLinks();
                    pushPreview();
                    showMsg('✅ ' + tpl.title + ' linki eklendi!', 'success');
                }
            }
        });

        // ============================================================
        // EFFECT BUTTONS
        // ============================================================
        document.querySelectorAll('.effect-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedEffect = btn.dataset.effect;
                pushPreview();
                showMsg('🎨 Efekt uygulandı!', 'success');
            });
        });

        // ============================================================
        // THEME PRESETS
        // ============================================================
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = THEMES[btn.dataset.theme];
                if (!theme) return;
                Object.keys(theme).forEach(key => {
                    const el = document.getElementById(key);
                    if (el) {
                        if (el.type === 'checkbox') el.checked = theme[key] !== false;
                        else if (el.type === 'range') el.value = theme[key];
                        else el.value = theme[key];
                    }
                });
                if (theme.nameNeon !== undefined) {
                    const effectKey = theme.nameNeon ? 'neon-blue' : 'default';
                    document.querySelectorAll('.effect-btn').forEach(b => {
                        b.classList.toggle('active', b.dataset.effect === effectKey);
                    });
                    selectedEffect = effectKey;
                }
                $('cov').textContent = Math.round((theme.cardOpacity || 0.8) * 100) + '%';
                $('cbv').textContent = (theme.cardBlur || 20) + 'px';
                $('pv').textContent = theme.particleCount || 40;
                $('ns').textContent = (theme.neonSize || 10) + 'px';
                if (theme.fontFamily) $('fontFamily').value = theme.fontFamily;
                pushPreview();
                showMsg('🎨 Tema uygulandı!', 'success');
            });
        });

        // ============================================================
        // SAVE FUNCTIONS
        // ============================================================
        function saveFields(fields, okText) {
            db.collection('users').doc(uid).set(fields, { merge: true })
                .then(() => { showMsg(okText, 'success'); })
                .catch(err => {
                    console.error('Save error:', err);
                    showMsg('Kaydedilemedi: ' + (err.code || err.message), 'error');
                });
        }

        $('saveProfileBtn').addEventListener('click', () => {
            const d = collectFormData();
            saveFields({
                name: d.name,
                bio: d.bio,
                avatar: d.avatar,
                fontFamily: d.fontFamily,
                emojiLeft: d.emojiLeft,
                emojiRight: d.emojiRight,
                emoji3d: d.emoji3d,
                nameGradient: d.nameGradient,
                nameGlow: d.nameGlow,
                nameNeon: d.nameNeon,
                neonColor: d.neonColor,
                neonSize: d.neonSize,
                showBadge: d.showBadge,
                badgeIcon: d.badgeIcon,
                badgeColor: d.badgeColor,
                cardOpacity: d.cardOpacity,
                cardBlur: d.cardBlur,
                _selectedEffect: selectedEffect
            }, '✅ Profil kaydedildi!');
        });

        $('saveLinksBtn').addEventListener('click', () => {
            const d = collectFormData();
            saveFields({
                links: currentLinks,
                btnStyle: d.btnStyle,
                btnGlow: d.btnGlow,
                btnShimmer: d.btnShimmer,
                btnBgColor: d.btnBgColor,
                btnBorderColor: d.btnBorderColor,
                btnHoverColor: d.btnHoverColor,
                btnHoverBorder: d.btnHoverBorder
            }, '✅ Linkler kaydedildi!');
        });

        $('saveBackgroundBtn').addEventListener('click', () => {
            const d = collectFormData();
            saveFields({
                bgColor: d.bgColor,
                bgImage: d.bgImage,
                bgVideo: d.bgVideo,
                particles: d.particles,
                particleColor: d.particleColor,
                particleCount: d.particleCount
            }, '✅ Arka plan kaydedildi!');
        });

        $('saveMusicBtn').addEventListener('click', () => {
            const d = collectFormData();
            saveFields({
                musicUrl: d.musicUrl,
                musicTitle: d.musicTitle,
                musicArtist: d.musicArtist,
                musicCover: d.musicCover,
                musicAutoplay: d.musicAutoplay,
                musicOpacity: d.musicOpacity,
                musicBlur: d.musicBlur
            }, '✅ Müzik kaydedildi!');
        });

        // ============================================================
        // FILE UPLOAD (Cloudinary)
        // ============================================================
        async function uploadFile(file, statusEl, targetInput) {
            if (!file) return;

            if (CLOUDINARY_CLOUD_NAME === 'demo' || CLOUDINARY_UPLOAD_PRESET === 'ml_default') {
                statusEl.textContent = '⚠️ Cloudinary ayarlarını yap!';
                statusEl.className = 'upload-status error';
                showMsg('⚠️ Lütfen Cloudinary ayarlarını admin.html içinde güncelle!', 'error');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                statusEl.textContent = '❌ 5MB max';
                statusEl.className = 'upload-status error';
                showMsg('Dosya boyutu 5MB\'dan büyük!', 'error');
                return;
            }

            statusEl.textContent = '⏳ Yükleniyor...';
            statusEl.className = 'upload-status loading';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            try {
                const res = await fetch(
                    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/upload`, {
                        method: 'POST',
                        body: formData
                    }
                );
                const data = await res.json();

                if (data.secure_url) {
                    document.getElementById(targetInput).value = data.secure_url;
                    statusEl.textContent = '✅';
                    statusEl.className = 'upload-status done';
                    showMsg('✅ Resim yüklendi!', 'success');
                    pushPreview();
                } else {
                    statusEl.textContent = '❌';
                    statusEl.className = 'upload-status error';
                    showMsg('Cloudinary hatası: ' + (data.error?.message || 'Bilinmeyen hata'), 'error');
                    console.error('Cloudinary error:', data);
                }
            } catch (err) {
                statusEl.textContent = '❌';
                statusEl.className = 'upload-status error';
                showMsg('Yükleme başarısız: ' + err.message, 'error');
                console.error('Upload error:', err);
            }
        }

        $('avatarUpload').addEventListener('change', (e) => {
            uploadFile(e.target.files[0], $('avatarStatus'), 'avatarInput');
            e.target.value = '';
        });

        $('bgUpload').addEventListener('change', (e) => {
            uploadFile(e.target.files[0], $('bgStatus'), 'bgImage');
            e.target.value = '';
        });

        // ============================================================
        // MUSIC TEST BUTTON
        // ============================================================
        $('testMusicBtn').addEventListener('click', () => {
            const url = $('musicUrl').value.trim();
            if (!url) {
                showMsg('Lütfen önce bir MP3 URL\'si gir.', 'error');
                return;
            }
            const audio = new Audio(url);
            audio.volume = 0.5;
            audio.play()
                .then(() => {
                    showMsg('✅ Müzik çalıyor!', 'success');
                    setTimeout(() => audio.pause(), 5000);
                })
                .catch(err => {
                    showMsg('❌ Müzik çalınamadı: ' + err.message, 'error');
                });
        });

        // ============================================================
        // OTHER ACTIONS
        // ============================================================
        $('urlChip').addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.origin + '/' + username)
                .then(() => showMsg('🔗 Link kopyalandı!', 'success'));
        });

        $('logoutBtn').addEventListener('click', () => auth.signOut().then(() => window.location.href = '/login.html'));

        $('resetPassBtn').addEventListener('click', () => {
            const email = auth.currentUser?.email;
            if (!email) return;
            auth.sendPasswordResetEmail(email)
                .then(() => showMsg('Şifre sıfırlama e-postası gönderildi.', 'success'))
                .catch(err => showMsg('Gönderilemedi: ' + (err.code || err.message), 'error'));
        });

        // ============================================================
        // CHANGE PASSWORD
        // ============================================================
        $('changePassBtn').addEventListener('click', async () => {
            const current = $('currentPassInput').value;
            const next = $('newPassInput').value;
            if (!current || next.length < 6) {
                showMsg('Mevcut şifreni gir ve en az 6 karakterlik yeni şifre seç.', 'error');
                return;
            }
            try {
                await reauthenticate(current);
                await auth.currentUser.updatePassword(next);
                $('currentPassInput').value = '';
                $('newPassInput').value = '';
                showMsg('🔑 Şifren güncellendi!', 'success');
            } catch (err) {
                showMsg(explainAuthError(err), 'error');
            }
        });

        // ============================================================
        // CHANGE USERNAME
        // ============================================================
        const RESERVED_USERNAMES = ['admin', 'login', 'register', 'index', 'api', 'www', 'app', 'static', 'assets',
            'favicon.ico', 'null', 'undefined', 'profile', 'preview', 'discover'
        ];

        const newUsernameInput = $('newUsernameInput');
        const newUsernameHint = $('newUsernameHint');
        let newUsernameValid = false;
        let usernameCheckTimer = null;

        newUsernameInput.addEventListener('input', () => {
            newUsernameInput.value = newUsernameInput.value.replace(/[^a-zA-Z0-9_]/g, '');
            newUsernameValid = false;
            clearTimeout(usernameCheckTimer);
            const v = newUsernameInput.value.trim();
            if (!v) { newUsernameHint.textContent = '';
                newUsernameHint.className = ''; return; }
            if (v.length < 3) {
                newUsernameHint.textContent = 'En az 3 karakter (harf, rakam, _)';
                newUsernameHint.className = 'hint';
                return;
            }
            if (v.toLowerCase() === username.toLowerCase()) {
                newUsernameHint.textContent = 'Bu zaten mevcut kullanıcı adın';
                newUsernameHint.className = 'hint bad';
                return;
            }
            if (RESERVED_USERNAMES.includes(v.toLowerCase())) {
                newUsernameHint.textContent = 'Bu kullanıcı adı ayrılmış';
                newUsernameHint.className = 'hint bad';
                return;
            }
            newUsernameHint.textContent = 'Kontrol ediliyor...';
            newUsernameHint.className = 'hint checking';
            usernameCheckTimer = setTimeout(() => {
                db.collection('usernames').doc(v.toLowerCase()).get().then(doc => {
                    if (doc.exists) {
                        newUsernameHint.textContent = '❌ Bu kullanıcı adı alınmış';
                        newUsernameHint.className = 'hint bad';
                        newUsernameValid = false;
                    } else {
                        newUsernameHint.textContent = '✓ ' + v + ' kullanılabilir';
                        newUsernameHint.className = 'hint ok';
                        newUsernameValid = true;
                    }
                }).catch(() => { newUsernameHint.textContent = ''; });
            }, 450);
        });

        $('changeUsernameBtn').addEventListener('click', async () => {
            const newUsername = newUsernameInput.value.trim();
            const newLower = newUsername.toLowerCase();
            if (newUsername.length < 3 || RESERVED_USERNAMES.includes(newLower) || newLower === username.toLowerCase()) {
                showMsg('Geçerli, farklı bir kullanıcı adı gir.', 'error');
                return;
            }
            if (!newUsernameValid) {
                showMsg('Kullanıcı adının müsait olduğunu doğrula.', 'error');
                return;
            }
            const btn = $('changeUsernameBtn');
            btn.disabled = true;
            const oldLower = username.toLowerCase();
            try {
                await db.runTransaction(async (tx) => {
                    const newRef = db.collection('usernames').doc(newLower);
                    const newSnap = await tx.get(newRef);
                    if (newSnap.exists) throw new Error('taken');
                    tx.set(newRef, { uid, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    tx.update(db.collection('users').doc(uid), { username: newUsername, usernameLower: newLower });
                    tx.delete(db.collection('usernames').doc(oldLower));
                });
                username = newUsername;
                $('urlChip').textContent = window.location.host + '/' + username;
                $('previewLink').href = '/' + username;
                $('currentUsernameLabel').textContent = '@' + username;
                newUsernameInput.value = '';
                newUsernameHint.textContent = '';
                showMsg('✅ Kullanıcı adın güncellendi!', 'success');
            } catch (err) {
                showMsg(err.message === 'taken' ? 'Bu kullanıcı adı az önce alındı.' : 'Değiştirilemedi: ' + (err.code || err
                    .message), 'error');
            }
            btn.disabled = false;
        });

        // ============================================================
        // DELETE ACCOUNT
        // ============================================================
        $('deleteAccountBtn').addEventListener('click', async () => {
            const password = $('deletePassInput').value;
            if (!password) { showMsg('Onaylamak için şifreni gir.', 'error'); return; }
            if (!confirm('Hesabını ve bio sayfanı KALICI olarak silmek istediğine emin misin?')) return;
            const btn = $('deleteAccountBtn');
            btn.disabled = true;
            try {
                await reauthenticate(password);
                const batch = db.batch();
                batch.delete(db.collection('usernames').doc(username.toLowerCase()));
                batch.delete(db.collection('users').doc(uid).collection('private').doc('data'));
                batch.delete(db.collection('users').doc(uid));
                await batch.commit();
                await auth.currentUser.delete();
                window.location.href = '/';
            } catch (err) {
                showMsg(explainAuthError(err), 'error');
                btn.disabled = false;
            }
        });

        // ============================================================
        // RANGE LABEL UPDATES
        // ============================================================
        $('cardOpacity').addEventListener('input', function() { $('cov').textContent = this.value + '%'; });
        $('cardBlur').addEventListener('input', function() { $('cbv').textContent = this.value + 'px'; });
        $('particleCount').addEventListener('input', function() { $('pv').textContent = this.value; });
        $('neonSize').addEventListener('input', function() { $('ns').textContent = this.value + 'px'; });
        $('musicOpacity').addEventListener('input', function() { $('mov').textContent = this.value + '%'; });
        $('musicBlur').addEventListener('input', function() { $('mbv').textContent = this.value + 'px'; });

        // ============================================================
        // MOBILE TABS
        // ============================================================
        const tabEdit = $('tabEdit');
        const tabPreview = $('tabPreview');
        const editPane = $('editPane');
        const previewPane = $('previewPane');

        tabEdit.addEventListener('click', () => {
            tabEdit.classList.add('active');
            tabPreview.classList.remove('active');
            editPane.classList.remove('tab-hidden');
            previewPane.classList.add('tab-hidden');
        });
        tabPreview.addEventListener('click', () => {
            tabPreview.classList.add('active');
            tabEdit.classList.remove('active');
            previewPane.classList.remove('tab-hidden');
            editPane.classList.add('tab-hidden');
            pushPreview();
        });

        if (window.innerWidth <= 900) previewPane.classList.add('tab-hidden');
    </script>
</body>
</html>
