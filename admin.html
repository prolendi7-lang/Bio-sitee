<!DOCTYPE html>
<html lang="tr">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!-- HTML yapısı aynı - sadece JS değişti -->

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDNnqSKYVW_JMc4CO5KoNQb4ctrMdIMS6s",
            authDomain: "rolex-bio.firebaseapp.com",
            projectId: "rolex-bio",
            storageBucket: "rolex-bio.firebasestorage.app",
            messagingSenderId: "182739949955",
            appId: "1:182739949955:web:bd859e25ceee8936273eb6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // CLOUDINARY CONFIG - KENDİ BİLGİLERİNİ GİR!
        // ============================================================
        const CLOUDINARY_CLOUD_NAME = 'demo'; // 👈 KENDİ CLOUD_NAME'İNİ GİR
        const CLOUDINARY_UPLOAD_PRESET = 'ml_default'; // 👈 KENDİ UPLOAD_PRESET'İNİ GİR

        // ============================================================
        // STATE
        // ============================================================
        let uid = null;
        let username = '';
        let currentLinks = [];
        let previewReady = false;
        let pendingPreview = null;
        let selectedEffect = 'default';

        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        const app = $('app');
        const gate = $('gate');
        const message = $('message');
        const previewFrame = $('previewFrame');

        // ============================================================
        // AUTH STATE
        // ============================================================
        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = '/login.html'; return; }
            uid = user.uid;
            $('accountEmail').textContent = user.email || '';
            updateVerifyUI(user);
            loadData();
        });

        // ============================================================
        // VERIFY UI
        // ============================================================
        function updateVerifyUI(user) {
            const banner = $('verifyBanner');
            const tag = $('verifiedTag');
            if (user.emailVerified) {
                banner.classList.add('hidden');
                tag.textContent = '✓ doğrulanmış';
                db.collection('users').doc(uid).get().then(doc => {
                    if (doc.exists && doc.data().emailVerified !== true) {
                        db.collection('users').doc(uid).set({ emailVerified: true }, { merge: true });
                    }
                });
            } else {
                banner.classList.remove('hidden');
                tag.textContent = '';
            }
        }

        let resendCooldown = false;
        $('resendVerifyBtn').addEventListener('click', async () => {
            if (resendCooldown) return;
            const btn = $('resendVerifyBtn');
            try {
                await auth.currentUser.sendEmailVerification();
                showMsg('Doğrulama e-postası tekrar gönderildi.', 'success');
                resendCooldown = true;
                btn.disabled = true;
                setTimeout(() => { resendCooldown = false;
                    btn.disabled = false; }, 60000);
            } catch (err) {
                showMsg('Gönderilemedi (' + (err.code || err.message) + ')', 'error');
            }
        });

        $('checkVerifyBtn').addEventListener('click', async () => {
            await auth.currentUser.reload();
            updateVerifyUI(auth.currentUser);
            if (auth.currentUser.emailVerified) showMsg('E-posta doğrulandı! 🎉', 'success');
            else showMsg('Henüz doğrulanmamış görünüyor.', 'error');
        });

        // ============================================================
        // HELPERS
        // ============================================================
        function showMsg(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
            clearTimeout(message._timer);
            message._timer = setTimeout(() => { message.style.display = 'none'; }, 4000);
            message.style.display = 'block';
        }

        function safeUrl(url) {
            if (!url) return '';
            try {
                const u = new URL(String(url), window.location.href);
                if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
            } catch (e) { return ''; }
        }

        function explainAuthError(err) {
            const code = err?.code;
            if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'Mevcut şifre yanlış.';
            if (code === 'auth/too-many-requests') return 'Çok fazla deneme, biraz bekleyip tekrar dene.';
            return 'Hata: ' + (code || err?.message || 'bilinmeyen');
        }

        async function reauthenticate(password) {
            const cred = firebase.auth.EmailAuthProvider.credential(auth.currentUser.email, password);
            await auth.currentUser.reauthenticateWithCredential(cred);
        }

        // ============================================================
        // EFFECTS
        // ============================================================
        const EFFECTS = {
            'default': { gradient: 'linear-gradient(135deg, #F9FAFB, #9CA3AF)', glow: 'none', neon: false },
            'gold': { gradient: 'linear-gradient(135deg, #FFD700, #F59E0B, #FFD700)', glow: '0 0 20px rgba(245,158,11,0.5)',
                neon: false },
            'neon-red': { gradient: 'linear-gradient(135deg, #fff, #fff)', glow: 'none', neon: true,
            neonColor: '#EF4444', neonSize: 10 },
            'neon-blue': { gradient: 'linear-gradient(135deg, #fff, #fff)', glow: 'none', neon: true,
            neonColor: '#3B82F6', neonSize: 10 },
            'purple': { gradient: 'linear-gradient(135deg, #C084FC, #7C3AED)', glow: '0 0 20px rgba(139,92,246,0.5)',
                neon: false },
            'rainbow': { gradient: 'linear-gradient(135deg, #EF4444, #F59E0B, #10B981, #3B82F6, #8B5CF6)',
                glow: '0 0 20px rgba(255,255,255,0.3)', neon: false }
        };

        // ============================================================
        // TEMPLATES
        // ============================================================
        const TEMPLATES = {
            'telegram': { icon: '📱', title: 'Telegram', url: 'https://t.me/' },
            'discord': { icon: '🎮', title: 'Discord', url: 'https://discord.gg/' },
            'youtube': { icon: '▶️', title: 'YouTube', url: 'https://youtube.com/@' },
            'instagram': { icon: '📷', title: 'Instagram', url: 'https://instagram.com/' },
            'tiktok': { icon: '🎵', title: 'TikTok', url: 'https://tiktok.com/@' },
            'twitch': { icon: '📺', title: 'Twitch', url: 'https://twitch.tv/' },
            'steam': { icon: '🎯', title: 'Steam', url: 'https://steamcommunity.com/id/' },
            'spotify': { icon: '🎧', title: 'Spotify', url: 'https://open.spotify.com/user/' },
            'github': { icon: '💻', title: 'GitHub', url: 'https://github.com/' },
            'x': { icon: '🐦', title: 'X', url: 'https://x.com/' },
            'website': { icon: '🌐', title: 'Website', url: 'https://' }
        };

        // ============================================================
        // THEME PRESETS
        // ============================================================
        const THEMES = {
            'cyberpunk': {
                bgColor: '#0B0F17',
                bgImage: '',
                bgVideo: '',
                particleColor: 'rgba(139,92,246,0.3)',
                particleCount: 50,
                nameGradient: 'linear-gradient(135deg, #C084FC, #8B5CF6)',
                nameGlow: '0 0 30px rgba(139,92,246,0.4)',
                neonColor: '#8B5CF6',
                neonSize: 14,
                nameNeon: false,
                badgeColor: '#8B5CF6',
                btnBgColor: 'rgba(139,92,246,0.15)',
                btnBorderColor: '#8B5CF6',
                btnHoverColor: 'rgba(139,92,246,0.3)',
                btnHoverBorder: '#C084FC',
                cardOpacity: 0.85,
                cardBlur: 24,
                fontFamily: 'Space Grotesk'
            },
            'minimal': {
                bgColor: '#0B0F17',
                bgImage: '',
                bgVideo: '',
                particleColor: 'rgba(255,255,255,0.15)',
                particleCount: 30,
                nameGradient: 'linear-gradient(135deg, #F9FAFB, #9CA3AF)',
                nameGlow: 'none',
                neonColor: '#ffffff',
                neonSize: 8,
                nameNeon: false,
                badgeColor: '#6B7280',
                btnBgColor: 'rgba(255,255,255,0.04)',
                btnBorderColor: 'rgba(255,255,255,0.08)',
                btnHoverColor: 'rgba(255,255,255,0.08)',
                btnHoverBorder: 'rgba(255,255,255,0.15)',
                cardOpacity: 0.7,
                cardBlur: 12,
                fontFamily: 'Inter'
            },
            'gold': {
                bgColor: '#0B0F17',
                bgImage: '',
                bgVideo: '',
                particleColor: 'rgba(245,158,11,0.2)',
                particleCount: 35,
                nameGradient: 'linear-gradient(135deg, #FFD700, #F59E0B, #FFD700)',
                nameGlow: '0 0 30px rgba(245,158,11,0.3)',
                neonColor: '#F59E0B',
                neonSize: 12,
                nameNeon: false,
                badgeColor: '#F59E0B',
                btnBgColor: 'rgba(245,158,11,0.1)',
                btnBorderColor: '#F59E0B',
                btnHoverColor: 'rgba(245,158,11,0.2)',
                btnHoverBorder: '#FFD700',
                cardOpacity: 0.8,
                cardBlur: 18,
                fontFamily: 'Playfair Display'
            },
            'neon': {
                bgColor: '#0B0F17',
                bgImage: '',
                bgVideo: '',
                particleColor: 'rgba(16,185,129,0.25)',
                particleCount: 60,
                nameGradient: 'linear-gradient(135deg, #34D399, #10B981)',
                nameGlow: '0 0 30px rgba(16,185,129,0.3)',
                neonColor: '#10B981',
                neonSize: 14,
                nameNeon: true,
                badgeColor: '#10B981',
                btnBgColor: 'rgba(16,185,129,0.12)',
                btnBorderColor: '#10B981',
                btnHoverColor: 'rgba(16,185,129,0.25)',
                btnHoverBorder: '#34D399',
                cardOpacity: 0.82,
                cardBlur: 20,
                fontFamily: 'Space Grotesk'
            }
        };

        // ============================================================
        // LOAD DATA
        // ============================================================
        function loadData() {
            db.collection('users').doc(uid).get().then(doc => {
                if (!doc.exists) {
                    gate.innerHTML =
                    'Profil bulunamadı. Kayıt işlemini tamamlamadın — çıkış yapıp tekrar dene.';
                    return;
                }
                const d = doc.data();
                username = d.username || '';
                $('urlChip').textContent = window.location.host + '/' + username;
                $('previewLink').href = '/' + username;
                $('currentUsernameLabel').textContent = '@' + username;
                $('usernameHostLabel').textContent = window.location.host + '/';

                // Formları doldur
                $('nameInput').value = d.name || '';
                $('bioInput').value = d.bio || '';
                $('avatarInput').value = d.avatar || '';
                $('fontFamily').value = d.fontFamily || '';
                $('emojiLeft').value = d.emojiLeft || '';
                $('emojiRight').value = d.emojiRight || '';
                $('emoji3d').checked = d.emoji3d !== false;
                $('nameGradient').value = d.nameGradient || '';
                $('nameGlow').value = d.nameGlow || '';
                $('neonColor').value = d.neonColor || '';
                $('neonSize').value = d.neonSize || 10;
                $('ns').textContent = (d.neonSize || 10) + 'px';
                $('showBadge').checked = d.showBadge !== false;
                $('badgeIcon').value = d.badgeIcon || '✓';
                $('badgeColor').value = d.badgeColor || 'linear-gradient(135deg, #3B82F6, #8B5CF6)';
                $('cardOpacity').value = (d.cardOpacity != null ? d.cardOpacity : 0.8) * 100;
                $('cov').textContent = Math.round((d.cardOpacity != null ? d.cardOpacity : 0.8) * 100) + '%';
                $('cardBlur').value = d.cardBlur != null ? d.cardBlur : 20;
                $('cbv').textContent = (d.cardBlur != null ? d.cardBlur : 20) + 'px';
                $('bgColor').value = d.bgColor || '';
                $('bgImage').value = d.bgImage || '';
                $('bgVideo').value = d.bgVideo || '';
                $('particlesToggle').checked = d.particles !== false;
                $('particleColor').value = d.particleColor || 'rgba(59,130,246,0.3)';
                $('particleCount').value = d.particleCount || 40;
                $('pv').textContent = d.particleCount || 40;
                $('btnStyle').value = d.btnStyle || 'rounded-full';
                $('btnGlow').checked = d.btnGlow !== false;
                $('btnShimmer').checked = d.btnShimmer !== false;
                $('btnBgColor').value = d.btnBgColor || '';
                $('btnBorderColor').value = d.btnBorderColor || '';
                $('btnHoverColor').value = d.btnHoverColor || '';
                $('btnHoverBorder').value = d.btnHoverBorder || '';
                $('musicUrl').value = d.musicUrl || '';
                $('musicTitleInput').value = d.musicTitle || '';
                $('musicArtist').value = d.musicArtist || '';
                $('musicCover').value = d.musicCover || '';
                $('musicAutoplay').checked = d.musicAutoplay !== false;
                $('musicOpacity').value = (d.musicOpacity != null ? d.musicOpacity : 0.9) * 100;
                $('mov').textContent = Math.round((d.musicOpacity != null ? d.musicOpacity : 0.9) * 100) + '%';
                $('musicBlur').value = d.musicBlur != null ? d.musicBlur : 10;
                $('mbv').textContent = (d.musicBlur != null ? d.musicBlur : 10) + 'px';
                $('totalViews').textContent = d.views || 0;
                currentLinks = d.links || [];
                renderLinks();

                const savedEffect = d._selectedEffect || 'default';
                selectedEffect = savedEffect;
                document.querySelectorAll('.effect-btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.effect === savedEffect);
                });

                gate.classList.add('hidden');
                app.classList.remove('hidden');
                pushPreview();
            }).catch(err => {
                gate.innerHTML = 'Profil yüklenemedi: ' + (err.code || err.message);
            });
        }

        // ============================================================
        // COLLECT FORM DATA
        // ============================================================
        function collectFormData() {
            const ef = EFFECTS[selectedEffect] || EFFECTS['default'];
            return {
                name: $('nameInput').value,
                bio: $('bioInput').value,
                avatar: $('avatarInput').value,
                fontFamily: $('fontFamily').value,
                emojiLeft: $('emojiLeft').value,
                emojiRight: $('emojiRight').value,
                emoji3d: $('emoji3d').checked,
                nameGradient: $('nameGradient').value || ef.gradient,
                nameGlow: $('nameGlow').value || ef.glow,
                nameNeon: ef.neon,
                neonColor: $('neonColor').value || ef.neonColor || '#3B82F6',
                neonSize: parseInt($('neonSize').value) || 10,
                showBadge: $('showBadge').checked,
                badgeIcon: $('badgeIcon').value || '✓',
                badgeColor: $('badgeColor').value || 'linear-gradient(135deg, #3B82F6, #8B5CF6)',
                cardOpacity: parseInt($('cardOpacity').value) / 100,
                cardBlur: parseInt($('cardBlur').value) || 20,
                bgColor: $('bgColor').value,
                bgImage: $('bgImage').value,
                bgVideo: $('bgVideo').value,
                particles: $('particlesToggle').checked,
                particleColor: $('particleColor').value || 'rgba(59,130,246,0.3)',
                particleCount: parseInt($('particleCount').value) || 40,
                links: currentLinks,
                btnStyle: $('btnStyle').value || 'rounded-full',
                btnGlow: $('btnGlow').checked,
                btnShimmer: $('btnShimmer').checked,
                btnBgColor: $('btnBgColor').value,
                btnBorderColor: $('btnBorderColor').value,
                btnHoverColor: $('btnHoverColor').value,
                btnHoverBorder: $('btnHoverBorder').value,
                musicUrl: $('musicUrl').value,
                musicTitle: $('musicTitleInput').value,
                musicArtist: $('musicArtist').value,
                musicCover: $('musicCover').value,
                musicAutoplay: $('musicAutoplay').checked,
                musicOpacity: parseInt($('musicOpacity').value) / 100,
                musicBlur: parseInt($('musicBlur').value) || 10,
                _selectedEffect: selectedEffect
            };
        }

        // ============================================================
        // PREVIEW (postMessage)
        // ============================================================
        let pushTimer = null;

        function pushPreview() {
            clearTimeout(pushTimer);
            pushTimer = setTimeout(() => {
                const payload = collectFormData();
                if (previewReady) {
                    previewFrame.contentWindow.postMessage({ type: 'profile-preview', payload }, '*');
                } else {
                    pendingPreview = payload;
                }
            }, 80);
        }

        window.addEventListener('message', (ev) => {
            if (ev.data && ev.data.type === 'preview-ready') {
                previewReady = true;
                if (pendingPreview) {
                    previewFrame.contentWindow.postMessage({ type: 'profile-preview', payload: pendingPreview }, '*');
                    pendingPreview = null;
                }
            }
        });

        $('editPane').addEventListener('input', pushPreview);
        $('editPane').addEventListener('change', pushPreview);

        // ============================================================
        // RENDER LINKS (Sortable)
        // ============================================================
        function renderLinks() {
            const container = $('linksList');
            container.innerHTML = '';
            currentLinks.forEach((l, i) => {
                const row = document.createElement('div');
                row.className = 'link-item';
                row.dataset.index = i;

                const handle = document.createElement('span');
                handle.className = 'drag-handle';
                handle.textContent = '⋮⋮';

                const iconInput = document.createElement('input');
                iconInput.type = 'text';
                iconInput.placeholder = '🔗';
                iconInput.style.width = '44px';
                iconInput.value = l.icon || '🔗';
                iconInput.oninput = () => { currentLinks[i].icon = iconInput.value;
                    pushPreview(); };

                const titleInput = document.createElement('input');
                titleInput.type = 'text';
                titleInput.placeholder = 'Başlık';
                titleInput.value = l.title || '';
                titleInput.oninput = () => { currentLinks[i].title = titleInput.value;
                    pushPreview(); };

                const urlInput = document.createElement('input');
                urlInput.type = 'text';
                urlInput.placeholder = 'URL';
                urlInput.value = l.url || '';
                urlInput.oninput = () => { currentLinks[i].url = urlInput.value;
                    pushPreview(); };

                const stats = document.createElement('span');
                stats.className = 'link-stats';
                stats.textContent = '🖱️ ' + (l.clicks || 0);

                const delBtn = document.createElement('button');
                delBtn.className = 'del-link';
                delBtn.textContent = '✕';
                delBtn.onclick = () => { currentLinks.splice(i, 1);
                    renderLinks();
                    pushPreview(); };

                row.append(handle, iconInput, titleInput, urlInput, stats, delBtn);
                container.appendChild(row);
            });

            if (window._sortable) window._sortable.destroy();
            window._sortable = new Sortable(container, {
                handle: '.drag-handle',
                animation: 150,
                onEnd: (ev) => {
                    const items = Array.from(container.children);
                    const newOrder = items.map(el => parseInt(el.dataset.index));
                    const reordered = newOrder.map(i => currentLinks[i]);
                    currentLinks = reordered;
                    renderLinks();
                    pushPreview();
                }
            });
        }

        // ============================================================
        // ADD LINK
        // ============================================================
        $('addLinkBtn').addEventListener('click', () => {
            currentLinks.push({ icon: '🔗', title: 'Yeni Link', url: 'https://', clicks: 0 });
            renderLinks();
            pushPreview();
        });

        // ============================================================
        // TEMPLATE BUTTONS
        // ============================================================
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('tpl-btn')) {
                const tpl = TEMPLATES[e.target.dataset.tpl];
                if (tpl) {
                    currentLinks.push({ icon: tpl.icon, title: tpl.title, url: tpl.url, clicks: 0 });
                    renderLinks();
                    pushPreview();
                }
            }
        });

        // ============================================================
        // EFFECT BUTTONS
        // ============================================================
        document.querySelectorAll('.effect-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedEffect = btn.dataset.effect;
                pushPreview();
            });
        });

        // ============================================================
        // THEME PRESETS
        // ============================================================
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = THEMES[btn.dataset.theme];
                if (!theme) return;
                Object.keys(theme).forEach(key => {
                    const el = document.getElementById(key);
                    if (el) {
                        if (el.type === 'checkbox') el.checked = theme[key] !== false;
                        else if (el.type === 'range') el.value = theme[key];
                        else el.value = theme[key];
                    }
                });
                if (theme.nameNeon !== undefined) {
                    const effectKey = theme.nameNeon ? 'neon-blue' : 'default';
                    document.querySelectorAll('.effect-btn').forEach(b => {
                        b.classList.toggle('active', b.dataset.effect === effectKey);
                    });
                    selectedEffect = effectKey;
                }
                $('cov').textContent = Math.round((theme.cardOpacity || 0.8) * 100) + '%';
                $('cbv').textContent = (theme.cardBlur || 20) + 'px';
                $('pv').textContent = theme.particleCount || 40;
                $('ns').textContent = (theme.neonSize || 10) + 'px';
                if (theme.fontFamily) $('fontFamily').value = theme.fontFamily;
                pushPreview();
                showMsg('🎨 Tema uygulandı!', 'success');
            });
        });

        // ============================================================
        // SAVE FUNCTIONS
        // ============================================================
        function saveFields(fields, okText) {
            db.collection('users').doc(uid).set(fields, { merge: true })
                .then(() => { showMsg(okText, 'success'); })
                .catch(err => {
                    console.error('Save error:', err);
                    showMsg('Kaydedilemedi: ' + (err.code || err.message), 'error');
                });
        }

        $('saveProfileBtn').addEventListener('click', () => {
            const d = collectFormData();
            saveFields({
                name: d.name,
                bio: d.bio,
                avatar: d.avatar,
                fontFamily: d.fontFamily,
                emojiLeft: d.emojiLeft,
                emojiRight: d.emojiRight,
                emoji3d: d.emoji3d,
                nameGradient: d.nameGradient,
                nameGlow: d.nameGlow,
                nameNeon: d.nameNeon,
                neonColor: d.neonColor,
                neonSize: d.neonSize,
                showBadge: d.showBadge,
                badgeIcon: d.badgeIcon,
                badgeColor: d.badgeColor,
                cardOpacity: d.cardOpacity,
                cardBlur: d.cardBlur,
                _selectedEffect: selectedEffect
            }, '✅ Profil kaydedildi!');
        });

        $('saveLinksBtn').addEventListener('click', () => {
            const d = collectFormData();
            saveFields({
                links: currentLinks,
                btnStyle: d.btnStyle,
                btnGlow: d.btnGlow,
                btnShimmer: d.btnShimmer,
                btnBgColor: d.btnBgColor,
                btnBorderColor: d.btnBorderColor,
                btnHoverColor: d.btnHoverColor,
                btnHoverBorder: d.btnHoverBorder
            }, '✅ Linkler kaydedildi!');
        });

        $('saveBackgroundBtn').addEventListener('click', () => {
            const d = collectFormData();
            saveFields({
                bgColor: d.bgColor,
                bgImage: d.bgImage,
                bgVideo: d.bgVideo,
                particles: d.particles,
                particleColor: d.particleColor,
                particleCount: d.particleCount
            }, '✅ Arka plan kaydedildi!');
        });

        $('saveMusicBtn').addEventListener('click', () => {
            const d = collectFormData();
            saveFields({
                musicUrl: d.musicUrl,
                musicTitle: d.musicTitle,
                musicArtist: d.musicArtist,
                musicCover: d.musicCover,
                musicAutoplay: d.musicAutoplay,
                musicOpacity: d.musicOpacity,
                musicBlur: d.musicBlur
            }, '✅ Müzik kaydedildi!');
        });

        // ============================================================
        // FILE UPLOAD (Cloudinary Unsigned) - HATA DÜZELTMELİ
        // ============================================================
        async function uploadFile(file, statusEl, targetInput) {
            if (!file) return;

            // Cloudinary yapılandırması kontrolü
            if (CLOUDINARY_CLOUD_NAME === 'demo' || CLOUDINARY_UPLOAD_PRESET === 'ml_default') {
                statusEl.textContent = '⚠️ Cloudinary ayarlarını yap!';
                statusEl.className = 'upload-status error';
                showMsg('⚠️ Lütfen Cloudinary ayarlarını admin.html içinde güncelle! (CLOUDINARY_CLOUD_NAME ve CLOUDINARY_UPLOAD_PRESET)', 'error');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                statusEl.textContent = '❌ 5MB max';
                statusEl.className = 'upload-status error';
                showMsg('Dosya boyutu 5MB\'dan büyük!', 'error');
                return;
            }

            statusEl.textContent = '⏳ Yükleniyor...';
            statusEl.className = 'upload-status loading';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            try {
                const res = await fetch(
                    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/upload`, {
                        method: 'POST',
                        body: formData
                    }
                );
                const data = await res.json();

                if (data.secure_url) {
                    document.getElementById(targetInput).value = data.secure_url;
                    statusEl.textContent = '✅';
                    statusEl.className = 'upload-status done';
                    showMsg('✅ Resim yüklendi!', 'success');
                    pushPreview();
                } else {
                    statusEl.textContent = '❌';
                    statusEl.className = 'upload-status error';
                    showMsg('Cloudinary hatası: ' + (data.error?.message || 'Bilinmeyen hata'), 'error');
                    console.error('Cloudinary error:', data);
                }
            } catch (err) {
                statusEl.textContent = '❌';
                statusEl.className = 'upload-status error';
                showMsg('Yükleme başarısız: ' + err.message, 'error');
                console.error('Upload error:', err);
            }
        }

        $('avatarUpload').addEventListener('change', (e) => {
            uploadFile(e.target.files[0], $('avatarStatus'), 'avatarInput');
            e.target.value = '';
        });

        $('bgUpload').addEventListener('change', (e) => {
            uploadFile(e.target.files[0], $('bgStatus'), 'bgImage');
            e.target.value = '';
        });

        // ============================================================
        // MUSIC TEST BUTTON
        // ============================================================
        // Admin panele müzik test butonu ekleyelim
        const musicTestBtn = document.createElement('button');
        musicTestBtn.className = 'btn-action secondary';
        musicTestBtn.textContent = '🎵 Müziği Test Et';
        musicTestBtn.style.marginTop = '4px';
        musicTestBtn.addEventListener('click', () => {
            const url = $('musicUrl').value.trim();
            if (!url) {
                showMsg('Lütfen önce bir MP3 URL\'si gir.', 'error');
                return;
            }
            const audio = new Audio(url);
            audio.volume = 0.5;
            audio.play()
                .then(() => {
                    showMsg('✅ Müzik çalıyor! Ses açık değilse kontrol et.', 'success');
                    setTimeout(() => audio.pause(), 5000);
                })
                .catch(err => {
                    showMsg('❌ Müzik çalınamadı: ' + err.message + ' (URL geçersiz veya CORS hatası)', 'error');
                });
        });
        $('saveMusicBtn').after(musicTestBtn);

        // ============================================================
        // OTHER ACTIONS
        // ============================================================
        $('urlChip').addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.origin + '/' + username)
                .then(() => showMsg('🔗 Link kopyalandı!', 'success'));
        });

        $('logoutBtn').addEventListener('click', () => auth.signOut().then(() => window.location.href = '/login.html'));

        $('resetPassBtn').addEventListener('click', () => {
            const email = auth.currentUser?.email;
            if (!email) return;
            auth.sendPasswordResetEmail(email)
                .then(() => showMsg('Şifre sıfırlama e-postası gönderildi.', 'success'))
                .catch(err => showMsg('Gönderilemedi: ' + (err.code || err.message), 'error'));
        });

        // ============================================================
        // CHANGE PASSWORD
        // ============================================================
        $('changePassBtn').addEventListener('click', async () => {
            const current = $('currentPassInput').value;
            const next = $('newPassInput').value;
            if (!current || next.length < 6) {
                showMsg('Mevcut şifreni gir ve en az 6 karakterlik yeni şifre seç.', 'error');
                return;
            }
            try {
                await reauthenticate(current);
                await auth.currentUser.updatePassword(next);
                $('currentPassInput').value = '';
                $('newPassInput').value = '';
                showMsg('🔑 Şifren güncellendi!', 'success');
            } catch (err) {
                showMsg(explainAuthError(err), 'error');
            }
        });

        // ============================================================
        // CHANGE USERNAME
        // ============================================================
        const RESERVED_USERNAMES = ['admin', 'login', 'register', 'index', 'api', 'www', 'app', 'static', 'assets',
            'favicon.ico', 'null', 'undefined', 'profile', 'preview', 'discover'
        ];

        const newUsernameInput = $('newUsernameInput');
        const newUsernameHint = $('newUsernameHint');
        let newUsernameValid = false;
        let usernameCheckTimer = null;

        newUsernameInput.addEventListener('input', () => {
            newUsernameInput.value = newUsernameInput.value.replace(/[^a-zA-Z0-9_]/g, '');
            newUsernameValid = false;
            clearTimeout(usernameCheckTimer);
            const v = newUsernameInput.value.trim();
            if (!v) { newUsernameHint.textContent = '';
                newUsernameHint.className = ''; return; }
            if (v.length < 3) {
                newUsernameHint.textContent = 'En az 3 karakter (harf, rakam, _)';
                newUsernameHint.className = 'hint';
                return;
            }
            if (v.toLowerCase() === username.toLowerCase()) {
                newUsernameHint.textContent = 'Bu zaten mevcut kullanıcı adın';
                newUsernameHint.className = 'hint bad';
                return;
            }
            if (RESERVED_USERNAMES.includes(v.toLowerCase())) {
                newUsernameHint.textContent = 'Bu kullanıcı adı ayrılmış';
                newUsernameHint.className = 'hint bad';
                return;
            }
            newUsernameHint.textContent = 'Kontrol ediliyor...';
            newUsernameHint.className = 'hint checking';
            usernameCheckTimer = setTimeout(() => {
                db.collection('usernames').doc(v.toLowerCase()).get().then(doc => {
                    if (doc.exists) {
                        newUsernameHint.textContent = '❌ Bu kullanıcı adı alınmış';
                        newUsernameHint.className = 'hint bad';
                        newUsernameValid = false;
                    } else {
                        newUsernameHint.textContent = '✓ ' + v + ' kullanılabilir';
                        newUsernameHint.className = 'hint ok';
                        newUsernameValid = true;
                    }
                }).catch(() => { newUsernameHint.textContent = ''; });
            }, 450);
        });

        $('changeUsernameBtn').addEventListener('click', async () => {
            const newUsername = newUsernameInput.value.trim();
            const newLower = newUsername.toLowerCase();
            if (newUsername.length < 3 || RESERVED_USERNAMES.includes(newLower) || newLower === username.toLowerCase()) {
                showMsg('Geçerli, farklı bir kullanıcı adı gir.', 'error');
                return;
            }
            if (!newUsernameValid) {
                showMsg('Kullanıcı adının müsait olduğunu doğrula.', 'error');
                return;
            }
            const btn = $('changeUsernameBtn');
            btn.disabled = true;
            const oldLower = username.toLowerCase();
            try {
                await db.runTransaction(async (tx) => {
                    const newRef = db.collection('usernames').doc(newLower);
                    const newSnap = await tx.get(newRef);
                    if (newSnap.exists) throw new Error('taken');
                    tx.set(newRef, { uid, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    tx.update(db.collection('users').doc(uid), { username: newUsername, usernameLower: newLower });
                    tx.delete(db.collection('usernames').doc(oldLower));
                });
                username = newUsername;
                $('urlChip').textContent = window.location.host + '/' + username;
                $('previewLink').href = '/' + username;
                $('currentUsernameLabel').textContent = '@' + username;
                newUsernameInput.value = '';
                newUsernameHint.textContent = '';
                showMsg('✅ Kullanıcı adın güncellendi!', 'success');
            } catch (err) {
                showMsg(err.message === 'taken' ? 'Bu kullanıcı adı az önce alındı.' : 'Değiştirilemedi: ' + (err.code || err
                    .message), 'error');
            }
            btn.disabled = false;
        });

        // ============================================================
        // DELETE ACCOUNT
        // ============================================================
        $('deleteAccountBtn').addEventListener('click', async () => {
            const password = $('deletePassInput').value;
            if (!password) { showMsg('Onaylamak için şifreni gir.', 'error'); return; }
            if (!confirm('Hesabını ve bio sayfanı KALICI olarak silmek istediğine emin misin?')) return;
            const btn = $('deleteAccountBtn');
            btn.disabled = true;
            try {
                await reauthenticate(password);
                const batch = db.batch();
                batch.delete(db.collection('usernames').doc(username.toLowerCase()));
                batch.delete(db.collection('users').doc(uid).collection('private').doc('data'));
                batch.delete(db.collection('users').doc(uid));
                await batch.commit();
                await auth.currentUser.delete();
                window.location.href = '/';
            } catch (err) {
                showMsg(explainAuthError(err), 'error');
                btn.disabled = false;
            }
        });

        // ============================================================
        // RANGE LABEL UPDATES
        // ============================================================
        $('cardOpacity').addEventListener('input', function() { $('cov').textContent = this.value + '%'; });
        $('cardBlur').addEventListener('input', function() { $('cbv').textContent = this.value + 'px'; });
        $('particleCount').addEventListener('input', function() { $('pv').textContent = this.value; });
        $('neonSize').addEventListener('input', function() { $('ns').textContent = this.value + 'px'; });
        $('musicOpacity').addEventListener('input', function() { $('mov').textContent = this.value + '%'; });
        $('musicBlur').addEventListener('input', function() { $('mbv').textContent = this.value + 'px'; });

        // ============================================================
        // MOBILE TABS
        // ============================================================
        const tabEdit = $('tabEdit');
        const tabPreview = $('tabPreview');
        const editPane = $('editPane');
        const previewPane = $('previewPane');

        tabEdit.addEventListener('click', () => {
            tabEdit.classList.add('active');
            tabPreview.classList.remove('active');
            editPane.classList.remove('tab-hidden');
            previewPane.classList.add('tab-hidden');
        });
        tabPreview.addEventListener('click', () => {
            tabPreview.classList.add('active');
            tabEdit.classList.remove('active');
            previewPane.classList.remove('tab-hidden');
            editPane.classList.add('tab-hidden');
            pushPreview();
        });

        if (window.innerWidth <= 900) previewPane.classList.add('tab-hidden');
    </script>
</body>
</html>
