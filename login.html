<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap / Kayıt Ol | Bio</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0B0F17;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 30%),
                              radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 30%);
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo p {
            color: #6B7280;
            font-size: 14px;
            margin-top: 4px;
        }
        .tab-bar {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tab-bar button {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: #9CA3AF;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-bar button.active {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            color: #fff;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .tab-bar button:hover:not(.active) {
            color: #fff;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #9CA3AF;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }
        .form-group input::placeholder {
            color: #4B5563;
        }
        .username-prefix {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .username-prefix:focus-within {
            border-color: #3B82F6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }
        .username-prefix span {
            padding: 0 8px 0 14px;
            color: #6B7280;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
        }
        .username-prefix input {
            border: none !important;
            background: transparent !important;
            padding: 14px 16px 14px 4px !important;
            box-shadow: none !important;
        }
        .username-prefix input:focus {
            box-shadow: none !important;
        }
        .hint {
            font-size: 12px;
            margin-top: 6px;
            min-height: 18px;
        }
        .hint.ok {
            color: #10B981;
        }
        .hint.bad {
            color: #EF4444;
        }
        .hint.checking {
            color: #6B7280;
        }
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            font-family: inherit;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.35);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .form-footer {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #6B7280;
        }
        .form-footer a {
            color: #3B82F6;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .form-footer a:hover {
            color: #8B5CF6;
            text-decoration: underline;
        }
        .msg {
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
            display: none;
            font-weight: 500;
        }
        .msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            color: #F87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .msg.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            color: #34D399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .tab-content {
            display: none;
            animation: fadeUp 0.4s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .forgot-link {
            display: block;
            text-align: right;
            font-size: 12px;
            color: #6B7280;
            margin-top: -10px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .forgot-link:hover {
            color: #3B82F6;
        }
        @media (max-width: 480px) {
            .glass-card {
                padding: 28px 20px;
            }
            .logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="glass-card" id="app">
        <div class="logo">
            <h1>bio<span style="color:#3B82F6; -webkit-text-fill-color:#3B82F6;">.</span></h1>
            <p>Kendi link sayfanı oluştur</p>
        </div>

        <div class="tab-bar">
            <button class="active" data-tab="loginTab">Giriş Yap</button>
            <button data-tab="registerTab">Kayıt Ol</button>
        </div>

        <!-- LOGIN -->
        <div class="tab-content active" id="loginTab">
            <form id="loginForm">
                <div class="form-group">
                    <label>E-posta</label>
                    <input type="email" id="loginEmail" placeholder="ornek@eposta.com" required>
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <span class="forgot-link" id="forgotLink">Şifremi unuttum</span>
                <button type="submit" class="btn-primary" id="loginBtn">Giriş Yap</button>
                <div class="msg" id="loginMsg"></div>
            </form>
        </div>

        <!-- REGISTER -->
        <div class="tab-content" id="registerTab">
            <form id="registerForm">
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <div class="username-prefix">
                        <span id="hostLabel">site.com/</span>
                        <input type="text" id="regUsername" placeholder="kullanici" maxlength="20" autocomplete="off" required>
                    </div>
                    <div class="hint" id="usernameHint"></div>
                </div>
                <div class="form-group">
                    <label>E-posta</label>
                    <input type="email" id="regEmail" placeholder="ornek@eposta.com" required>
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="regPassword" placeholder="En az 6 karakter" minlength="6" required>
                </div>
                <button type="submit" class="btn-primary" id="registerBtn">Hesap Oluştur</button>
                <div class="msg" id="registerMsg"></div>
            </form>
        </div>

        <div class="form-footer">
            <span id="footerText">Hesabın var mı? <a id="switchToLogin">Giriş yap</a></span>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNnqSKYVW_JMc4CO5KoNQb4ctrMdIMS6s",
            authDomain: "rolex-bio.firebaseapp.com",
            projectId: "rolex-bio",
            storageBucket: "rolex-bio.firebasestorage.app",
            messagingSenderId: "182739949955",
            appId: "1:182739949955:web:bd859e25ceee8936273eb6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // DOM REFS
        const tabs = document.querySelectorAll('[data-tab]');
        const contents = {
            login: document.getElementById('loginTab'),
            register: document.getElementById('registerTab')
        };
        const footerText = document.getElementById('footerText');

        function switchTab(tabId) {
            tabs.forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
            Object.keys(contents).forEach(key => {
                contents[key].classList.toggle('active', key === tabId);
            });
            if (tabId === 'login') {
                footerText.innerHTML = `Hesabın yok mu? <a id="switchToRegister">Kayıt ol</a>`;
                document.getElementById('switchToRegister')?.addEventListener('click', (e) => {
                    e.preventDefault();
                    switchTab('register');
                });
            } else {
                footerText.innerHTML = `Hesabın var mı? <a id="switchToLogin">Giriş yap</a>`;
                document.getElementById('switchToLogin')?.addEventListener('click', (e) => {
                    e.preventDefault();
                    switchTab('login');
                });
            }
        }

        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                switchTab(btn.dataset.tab);
            });
        });

        // Başlangıçta login tab aktif
        switchTab('login');

        document.getElementById('hostLabel').textContent = window.location.host + '/';

        const RESERVED = ['admin', 'login', 'register', 'index', 'api', 'www', 'app', 'static', 'assets',
            'favicon.ico', 'null', 'undefined', 'profile', 'preview', 'discover'
        ];

        const usernameInput = document.getElementById('regUsername');
        const hint = document.getElementById('usernameHint');
        let usernameValid = false;
        let checkTimer = null;

        usernameInput.addEventListener('input', () => {
            usernameInput.value = usernameInput.value.replace(/[^a-zA-Z0-9_]/g, '');
            usernameValid = false;
            clearTimeout(checkTimer);
            const v = usernameInput.value.trim();
            if (v.length < 3) {
                hint.textContent = 'En az 3 karakter (harf, rakam, _)';
                hint.className = 'hint';
                return;
            }
            if (RESERVED.includes(v.toLowerCase())) {
                hint.textContent = 'Bu kullanıcı adı ayrılmış';
                hint.className = 'hint bad';
                return;
            }
            hint.textContent = 'Kontrol ediliyor...';
            hint.className = 'hint checking';
            checkTimer = setTimeout(() => {
                db.collection('usernames').doc(v.toLowerCase()).get().then(doc => {
                    if (doc.exists) {
                        hint.textContent = '❌ Bu kullanıcı adı alınmış';
                        hint.className = 'hint bad';
                        usernameValid = false;
                    } else {
                        hint.textContent = '✓ ' + v + ' kullanılabilir';
                        hint.className = 'hint ok';
                        usernameValid = true;
                    }
                }).catch(() => { hint.textContent = ''; });
            }, 450);
        });

        function showMsg(el, text, type) {
            el.textContent = text;
            el.className = 'msg ' + type;
        }

        function explainAuthError(err) {
            const code = err?.code;
            if (code === 'auth/email-already-in-use') return 'Bu e-posta zaten kayıtlı.';
            if (code === 'auth/invalid-email') return 'Geçersiz e-posta adresi.';
            if (code === 'auth/weak-password') return 'Şifre en az 6 karakter olmalı.';
            if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential')
                return 'E-posta veya şifre hatalı.';
            if (code === 'auth/too-many-requests') return 'Çok fazla deneme, biraz bekleyip tekrar dene.';
            if (code === 'auth/network-request-failed') return 'Ağ bağlantısını kontrol et.';
            if (code === 'auth/operation-not-allowed') return 'Email/Password girişi kapalı. Firebase Console\'dan aç.';
            return 'Hata: ' + (code || err?.message || 'bilinmeyen');
        }

        // LOGIN
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const msg = document.getElementById('loginMsg');
            btn.disabled = true;
            try {
                await auth.signInWithEmailAndPassword(
                    document.getElementById('loginEmail').value.trim(),
                    document.getElementById('loginPassword').value
                );
                window.location.href = '/admin.html';
            } catch (err) {
                showMsg(msg, explainAuthError(err), 'error');
                btn.disabled = false;
            }
        });

        // FORGOT
        document.getElementById('forgotLink').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const msg = document.getElementById('loginMsg');
            if (!email) { showMsg(msg, 'Önce e-posta adresini gir.', 'error'); return; }
            try {
                await auth.sendPasswordResetEmail(email);
                showMsg(msg, 'Şifre sıfırlama bağlantısı gönderildi (spam klasörünü kontrol et).', 'success');
            } catch (err) {
                showMsg(msg, explainAuthError(err), 'error');
            }
        });

        // REGISTER
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const usernameLower = username.toLowerCase();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const btn = document.getElementById('registerBtn');
            const msg = document.getElementById('registerMsg');

            if (username.length < 3 || RESERVED.includes(usernameLower)) {
                showMsg(msg, 'Geçerli bir kullanıcı adı gir.', 'error');
                return;
            }
            if (!usernameValid) {
                showMsg(msg, 'Lütfen kullanıcı adının müsait olduğunu doğrula.', 'error');
                return;
            }
            if (password.length < 6) {
                showMsg(msg, 'Şifre en az 6 karakter olmalı.', 'error');
                return;
            }

            btn.disabled = true;
            showMsg(msg, 'Hesap oluşturuluyor...', 'success');

            try {
                const unameCheck = await db.collection('usernames').doc(usernameLower).get();
                if (unameCheck.exists) {
                    showMsg(msg, 'Bu kullanıcı adı az önce alındı.', 'error');
                    btn.disabled = false;
                    return;
                }

                let cred;
                try {
                    cred = await auth.createUserWithEmailAndPassword(email, password);
                } catch (authErr) {
                    showMsg(msg, explainAuthError(authErr), 'error');
                    btn.disabled = false;
                    return;
                }

                const uid = cred.user.uid;

                await db.runTransaction(async (tx) => {
                    const unameRef = db.collection('usernames').doc(usernameLower);
                    const unameSnap = await tx.get(unameRef);
                    if (unameSnap.exists) throw new Error('taken');
                    tx.set(unameRef, { uid, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    tx.set(db.collection('users').doc(uid).collection('private').doc('data'), { email });
                    tx.set(db.collection('users').doc(uid), {
                        uid,
                        username,
                        usernameLower,
                        name: username,
                        bio: '',
                        avatar: '',
                        emailVerified: false,
                        emojiLeft: '',
                        emojiRight: '',
                        emoji3d: true,
                        nameGradient: 'linear-gradient(135deg, #F9FAFB, #9CA3AF)',
                        nameGlow: 'none',
                        nameNeon: false,
                        neonColor: '#3B82F6',
                        neonSize: 10,
                        showBadge: true,
                        badgeIcon: '✓',
                        badgeColor: 'linear-gradient(135deg, #3B82F6, #8B5CF6)',
                        cardOpacity: 0.8,
                        cardBlur: 20,
                        bgColor: '#0B0F17',
                        bgImage: '',
                        bgVideo: '',
                        particles: true,
                        particleColor: 'rgba(59,130,246,0.3)',
                        particleCount: 40,
                        links: [],
                        btnStyle: 'rounded-full',
                        btnGlow: true,
                        btnShimmer: true,
                        btnBgColor: '',
                        btnBorderColor: '',
                        btnHoverColor: '',
                        btnHoverBorder: '',
                        musicUrl: '',
                        musicTitle: '',
                        musicArtist: '',
                        musicCover: '',
                        musicAutoplay: true,
                        musicOpacity: 0.9,
                        musicBlur: 10,
                        views: 0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });

                try {
                    await cred.user.sendEmailVerification();
                    showMsg(msg, 'Hesap oluşturuldu! Doğrulama e-postası gönderildi, yönlendiriliyorsun...',
                    'success');
                } catch (mailErr) {
                    showMsg(msg, 'Hesap oluştu ama doğrulama e-postası gönderilemedi. Yönlendiriliyorsun...',
                        'success');
                }

                setTimeout(() => { window.location.href = '/admin.html'; }, 1500);

            } catch (err) {
                if (err.message === 'taken') {
                    showMsg(msg, 'Bu kullanıcı adı az önce alındı.', 'error');
                } else if (err.code === 'permission-denied') {
                    showMsg(msg, 'Veritabanı izin hatası: Firestore güvenlik kurallarını yayınla.', 'error');
                } else {
                    showMsg(msg, 'Kayıt başarısız: ' + (err.code || err.message), 'error');
                }
                btn.disabled = false;
                try { await auth.currentUser?.delete(); } catch (e) {}
            }
        });
    </script>
</body>
</html>
