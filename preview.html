<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Önizleme</title>
    <link rel="stylesheet" href="/profile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Space+Grotesk:wght@400;600;700&family=DM+Sans:wght@400;600;700&family=Bebas+Neue&family=Caveat:wght@600&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            padding: 20px 12px;
            background: #0B0F17;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        .bg-video.hidden {
            display: none;
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        #joinOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-direction: column;
            user-select: none;
        }
        #joinOverlay h1 {
            color: #fff;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        #joinOverlay p {
            color: #888;
            margin-top: 10px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div id="joinOverlay">
        <h1>Click to Join</h1>
        <p>Müzikle birlikte keşfet</p>
    </div>

    <div class="particles" id="particles"></div>
    <video class="bg-video hidden" id="bgVideo" autoplay muted loop playsinline></video>
    <div class="container">
        <div class="profile-card" id="profileCard">
            <div class="avatar-container">
                <img class="avatar" id="avatar" src="https://i.imgur.com/6VBx3io.png" alt="Avatar">
                <div class="badge" id="badge">✓</div>
            </div>
            <div class="name-container">
                <span class="name-emoji" id="nameEmojiLeft"></span>
                <h1 class="name" id="nameDisplay">İsimsiz</h1>
                <span class="name-emoji" id="nameEmojiRight"></span>
            </div>
            <p class="bio-text" id="bioDisplay"></p>
            <div class="verified-label hidden" id="verifiedLabel">✓ Doğrulanmış hesap</div>
            <div class="links" id="linksContainer"></div>
            <div class="view-count">👁 <span id="viewCount">0</span></div>
        </div>
        <div class="music-player hidden" id="musicPlayer">
            <img class="music-cover" id="musicCover" src="https://i.imgur.com/6VBx3io.png" alt="cover">
            <div class="music-info">
                <div class="music-title" id="musicTitle">Müzik</div>
                <div class="music-artist" id="musicArtist">Sanatçı</div>
            </div>
            <button class="music-btn" id="playBtn" onclick="togglePlay()">▶</button>
        </div>
    </div>
    <audio id="bgMusic" loop style="display:none;"></audio>

    <script src="/render.js"></script>
    <script>
        window.addEventListener('message', (ev) => {
            if (!ev.data || ev.data.type !== 'profile-preview') return;
            const d = Object.assign({}, ev.data.payload, { musicAutoplay: false });
            applyProfileData(d);
        });

        window.parent.postMessage({ type: 'preview-ready' }, '*');

        const joinOverlay = document.getElementById('joinOverlay');
        if (joinOverlay) {
            joinOverlay.addEventListener('click', function() {
                this.style.display = 'none';
                const audio = document.getElementById('bgMusic');
                if (audio && audio.src) {
                    audio.play().catch(() => {});
                }
            });
        }
    </script>
</body>
</html>
